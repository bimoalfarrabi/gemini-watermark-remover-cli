name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: End-to-end removal
        shell: bash
        run: |
          node src/cli.js test/fixtures/sample-1k.png -o "$RUNNER_TEMP/out.png"
          test -s "$RUNNER_TEMP/out.png"

      - name: Doctor
        run: node src/cli.js doctor

  package:
    name: package integrity
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepublish checks
        run: node scripts/prepublish-check.mjs
      - name: Packed tarball installs and runs
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/probe" && cd "$RUNNER_TEMP/probe"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/*.tgz --no-audit --no-fund
          # The dependency ships its own `gwr` bin, so only the unambiguous
          # name is ours. Asserting `gwr` here would silently test upstream.
          ./node_modules/.bin/gemini-watermark --version
          ./node_modules/.bin/gemini-watermark --help | grep -q "remove Gemini watermarks"
          # And it must actually process an image when installed this way.
          cp "$GITHUB_WORKSPACE/test/fixtures/sample-1k.png" in.png
          ./node_modules/.bin/gemini-watermark in.png
          test -s in-clean.png

  binaries:
    name: standalone binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: node scripts/build-binaries.mjs

      - name: Smoke the linux binary
        run: |
          chmod +x release/gwr-linux-x64
          ./release/gwr-linux-x64 --version
          ./release/gwr-linux-x64 test/fixtures/sample-1k.png -o "$RUNNER_TEMP/linux-out.png"
          test -s "$RUNNER_TEMP/linux-out.png"

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-binaries
          path: release/gwr-*
          if-no-files-found: error

  windows-binary:
    name: standalone binary (windows, real run)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: bun build --compile --target=bun-windows-x64 --outfile=release/gwr-windows-x64.exe src/cli.js
      # Running it on Windows is the only proof the exe works; the linux job
      # can only cross-compile it.
      - name: Run the executable
        shell: pwsh
        run: |
          ./release/gwr-windows-x64.exe --version
          ./release/gwr-windows-x64.exe test/fixtures/sample-1k.png -o out.png
          if (-not (Test-Path out.png)) { throw "no output written" }
          if ((Get-Item out.png).Length -lt 1000) { throw "output too small" }
