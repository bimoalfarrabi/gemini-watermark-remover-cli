name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build everything, publish nothing
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/prepublish-check.mjs

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: node scripts/build-binaries.mjs
      - name: Smoke the linux binary
        run: |
          chmod +x release/gwr-linux-x64
          ./release/gwr-linux-x64 --version
          ./release/gwr-linux-x64 test/fixtures/sample-1k.png -o "$RUNNER_TEMP/bin-out.png"
          test -s "$RUNNER_TEMP/bin-out.png"
      - name: Checksums
        run: |
          cd release
          for f in gwr-*; do sha256sum "$f" >> SHA256SUMS.txt; done
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            release/gwr-*
            release/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: [verify, binaries]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check tag matches package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json $pkg" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: release
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/gwr-*
            release/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Standalone binaries — no Node.js or npm required.

            | Platform | File |
            | --- | --- |
            | Linux x64 | `gwr-linux-x64` |
            | Linux arm64 | `gwr-linux-arm64` |
            | macOS x64 | `gwr-macos-x64` |
            | macOS arm64 | `gwr-macos-arm64` |
            | Windows x64 | `gwr-windows-x64.exe` |

            ```bash
            chmod +x gwr-linux-x64
            ./gwr-linux-x64 photo.png        # writes photo-clean.png
            ```

            Verify a download against `SHA256SUMS.txt`.

            Or install from source:

            ```bash
            git clone https://github.com/bimoalfarrabi/gemini-watermark-remover-cli
            cd gemini-watermark-remover-cli && npm install
            node src/cli.js photo.png
            ```

  npm:
    # Opt-in: publishing requires an NPM_TOKEN secret. Kept separate so a
    # missing token can never block the GitHub release.
    needs: [verify]
    if: github.event_name == 'push' && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
